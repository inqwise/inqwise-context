name: Snyk Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Run monthly on the 1st at 8:00 AM UTC (free tier limit)
    - cron: "0 8 1 * *"
  workflow_dispatch:

jobs:
  snyk-info:
    name: Snyk Configuration Check
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}
    steps:
      - name: Check Snyk Token and provide info
        id: configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Snyk scans are skipped because SNYK_TOKEN is not configured."
            echo "To enable Snyk scanning, add SNYK_TOKEN to repository secrets."
            echo "Visit https://snyk.io to get your token."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Snyk token is configured. Security scanning will run on appropriate triggers."
          fi

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: snyk-info
    permissions:
      contents: read
      actions: read
      security-events: write
    # Run on PR, releases, and monthly schedule (free tier optimized)
    if: needs.snyk-info.outputs.enabled == 'true' && (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: maven

      - name: Build project
        run: mvn clean compile -DskipTests

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

      - name: Run Snyk to check for vulnerabilities
        run: snyk test --severity-threshold=high --sarif-file-output=snyk.sarif
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

  snyk-monitor:
    name: Snyk Monitor
    runs-on: ubuntu-latest
    needs: snyk-info
    # Only monitor on tags/releases to conserve free tier usage
    if: needs.snyk-info.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: maven

      - name: Build project
        run: mvn clean compile -DskipTests

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

      - name: Run Snyk monitor
        run: snyk monitor --project-name=inqwise-context
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-container:
    name: Snyk Container Scan
    runs-on: ubuntu-latest
    needs: snyk-info
    # Only run on releases and manual dispatch to conserve free tier
    if: needs.snyk-info.outputs.enabled == 'true' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: maven

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Build Docker image for scanning
        run: |
          cat > Dockerfile.scan << EOF
          FROM eclipse-temurin:21-jre-alpine
          COPY target/inqwise-context-*.jar app.jar
          ENTRYPOINT ["java","-jar","/app.jar"]
          EOF
          docker build -f Dockerfile.scan -t inqwise-context:scan .

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

      - name: Run Snyk to check Docker image for vulnerabilities
        run: snyk container test inqwise-context:scan --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
