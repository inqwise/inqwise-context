name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

jobs:
  release:
    name: Release to Maven Central
    runs-on: ubuntu-latest
    if: github.repository == 'inqwise/inqwise-context'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/resolve-release-version.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: maven
          server-id: sonatype-oss-release
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git user
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Maven Release (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mvn release:clean release:prepare release:perform \
            "-DreleaseVersion=$RELEASE_VERSION" \
            "-DdevelopmentVersion=$DEVELOPMENT_VERSION" \
            "-Dtag=$RELEASE_TAG" \
            -DskipTests \
            -Darguments="-Dmaven.deploy.skip=true -DskipTests"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          DEVELOPMENT_VERSION: ${{ steps.version.outputs.development_version }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy to Maven Central
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          git checkout -f "$RELEASE_TAG"
          mvn clean deploy -P sonatype-oss-release -Dmaven.deploy.skip=true -DskipTests "-DreleaseVersion=$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Prepare Release Assets
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          # The Maven release process already built the correct artifacts
          # We need to find them in the Maven local repository after release:perform
          VERSION="$RELEASE_VERSION"
          git checkout -f "$RELEASE_TAG"
          MAVEN_REPO="$HOME/.m2/repository/com/inqwise/inqwise-context/$VERSION"

          mkdir -p release-assets

          # Copy the release artifacts from Maven local repository
          if [ -d "$MAVEN_REPO" ]; then
            cp "$MAVEN_REPO/inqwise-context-$VERSION.jar" release-assets/ || echo "Main JAR not found"
            cp "$MAVEN_REPO/inqwise-context-$VERSION-sources.jar" release-assets/ || echo "Sources JAR not found"
            cp "$MAVEN_REPO/inqwise-context-$VERSION-javadoc.jar" release-assets/ || echo "Javadoc JAR not found"
          else
            echo "Maven repository directory not found: $MAVEN_REPO"
            echo "Falling back to building artifacts with correct version"
            # Checkout the release tag to build the correct version
            git checkout "$RELEASE_TAG"
            mvn clean package -P sonatype-oss-release -DskipTests
            cp target/inqwise-context-*.jar release-assets/
          fi

          # List what we actually have
          echo "Release assets prepared:"
          ls -la release-assets/
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Release ${{ steps.version.outputs.release_tag }}
          body: |
            🚀 **Release ${{ steps.version.outputs.release_tag }}**

            ## 📦 Maven Central
            ```xml
            <dependency>
                <groupId>com.inqwise</groupId>
                <artifactId>inqwise-context</artifactId>
                <version>${{ steps.version.outputs.release_version }}</version>
            </dependency>
            ```

            ## 📋 Release Assets
            - Main library JAR
            - Sources JAR
            - Javadoc JAR
            - All artifacts GPG signed

            ## 🔗 Links
            - [Maven Central](https://central.sonatype.com/artifact/com.inqwise/inqwise-context/${{ steps.version.outputs.release_version }})
            - [Documentation](https://github.com/inqwise/inqwise-context#readme)

            ---
            *Released automatically via GitHub Actions*
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Existing Release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
