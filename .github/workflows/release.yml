name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string

concurrency:
  group: inqwise-context-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Release to Maven Central
    runs-on: ubuntu-latest
    if: github.repository == 'inqwise/inqwise-context'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/resolve-release-version.sh

      - name: Verify release credentials
        run: bash .github/scripts/verify-release-credentials.sh
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"
          cache: maven
          server-id: sonatype-oss-release
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git user
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Build and test
        if: github.event_name == 'workflow_dispatch'
        run: mvn -B -ntp clean verify

      - name: Maven Release (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mvn -B -ntp release:clean release:prepare release:perform \
            "-DreleaseVersion=$RELEASE_VERSION" \
            "-DdevelopmentVersion=$DEVELOPMENT_VERSION" \
            "-Dtag=$RELEASE_TAG" \
            -DskipTests \
            -Darguments="-B -ntp -Dmaven.deploy.skip=true -DskipTests"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          DEVELOPMENT_VERSION: ${{ steps.version.outputs.development_version }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create detached release source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          COMMIT=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git worktree add --detach "$RUNNER_TEMP/inqwise-release-source" "$COMMIT"

      - name: Verify tagged release source
        id: source
        working-directory: ${{ runner.temp }}/inqwise-release-source
        run: bash "$GITHUB_WORKSPACE/.github/scripts/verify-release-source.sh"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ github.event_name == 'release' && github.sha || '' }}

      - name: Build and test tagged release
        working-directory: ${{ runner.temp }}/inqwise-release-source
        run: mvn -B -ntp clean verify

      - name: Deploy to Maven Central
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        working-directory: ${{ runner.temp }}/inqwise-release-source
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/verify-release-source.sh"
          mvn -B -ntp clean deploy -P sonatype-oss-release -Dmaven.deploy.skip=true -DskipTests "-DreleaseVersion=$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.release_commit }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Prepare Release Assets
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: bash .github/scripts/prepare-release-assets.sh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_BUILD_DIR: ${{ runner.temp }}/inqwise-release-source/target

      - name: Create GitHub Release (Manual Trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Release ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ steps.source.outputs.release_commit }}
          body: |
            🚀 **Release ${{ steps.version.outputs.release_tag }}**

            ## 📦 Maven Central
            ```xml
            <dependency>
                <groupId>com.inqwise</groupId>
                <artifactId>inqwise-context</artifactId>
                <version>${{ steps.version.outputs.release_version }}</version>
            </dependency>
            ```

            ## 📋 Release Assets
            - Main library JAR
            - Sources JAR
            - Javadoc JAR
            - Detached GPG signatures
            - All artifacts GPG signed
            - Source commit: `${{ steps.source.outputs.release_commit }}`

            ## 🔗 Links
            - [Maven Central](https://central.sonatype.com/artifact/com.inqwise/inqwise-context/${{ steps.version.outputs.release_version }})
            - [Documentation](https://github.com/inqwise/inqwise-context#readme)

            ---
            *Released automatically via GitHub Actions*
          files: |
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}.jar
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}.jar.asc
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-sources.jar
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-sources.jar.asc
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-javadoc.jar
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-javadoc.jar.asc
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Existing Release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          files: |
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}.jar
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}.jar.asc
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-sources.jar
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-sources.jar.asc
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-javadoc.jar
            release-assets/inqwise-context-${{ steps.version.outputs.release_version }}-javadoc.jar.asc
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
